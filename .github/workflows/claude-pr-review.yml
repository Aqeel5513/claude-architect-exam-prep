name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repo holds markdown study notes for the Claude architect exam.
            Review the changes in this pull request and check for:
            - Technical facts about Claude, the API, or agents that look wrong or outdated
            - Unclear explanations a beginner would struggle with
            - Broken markdown formatting (headings, tables, lists, code blocks)
            - Broken or suspicious links
            - Typos and grammar mistakes

            Use inline comments for specific lines. Finish with one short
            summary comment on the PR. Be friendly and concise; skip praise-only comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
