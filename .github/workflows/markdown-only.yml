name: Markdown only

on:
  push:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any non-markdown file exists
        run: |
          bad=$(git ls-files | grep -vE '\.md$' \
                | grep -vE '^(\.gitignore|\.github/workflows/.*\.ya?ml)$' || true)
          if [ -n "$bad" ]; then
            echo "Non-markdown files found:"
            echo "$bad"
            exit 1
          fi
          echo "All files are markdown ✅"
